name: Build and deploy game

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Godot and Web export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          include-templates: true
          use-dotnet: false

      - name: Import project resources
        run: godot --headless --editor --path . --quit

      - name: Run game tests
        run: godot --headless --path . res://test/nobe_test_suite.tscn

      - name: Export Web build
        run: |
          mkdir -p dist
          godot --headless --path . --export-release Web dist/index.html
          test -s dist/index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
