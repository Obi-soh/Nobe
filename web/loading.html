<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="manus-game-loading-screen" content="1">
  <title>$GODOT_PROJECT_NAME</title>
  $GODOT_HEAD_INCLUDE
  <style>
    :root { color-scheme: dark; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #090c12; }
    body { display: grid; place-items: center; color: #f4efe6; }
    #canvas { display: block; width: 100%; height: 100%; outline: none; }
    #loading { position: fixed; inset: 0; display: grid; place-items: center; align-content: center; gap: 14px; padding: 28px; background: radial-gradient(circle at 50% 22%, #211a2b 0%, #090c12 52%); text-align: center; }
    #mark { width: 116px; height: 116px; object-fit: contain; filter: drop-shadow(0 0 20px rgba(216,181,106,.3)); }
    h1 { margin: 0; font-size: clamp(26px, 7vw, 42px); letter-spacing: .03em; }
    #loading-status { margin: 0; color: #d8b56a; }
    progress { width: min(330px, 82vw); height: 9px; accent-color: #d8b56a; }
    #loading-notice { margin: 0; color: #a7afbf; max-width: 360px; }
    button { border: 1px solid #d8b56a; border-radius: 10px; padding: 12px 22px; background: #18202d; color: #f4efe6; font-size: 16px; cursor: pointer; }
    noscript { color: #ef8090; }
  </style>
</head>
<body>
  <canvas id="canvas" tabindex="0">المتصفح لا يدعم تشغيل اللعبة.</canvas>
  <section id="loading" role="status" aria-live="polite">
    <div id="mark" aria-hidden="true">◐</div>
    <h1>لَيْلَة الذِّئْب</h1>
    <p id="loading-status">جارٍ فتح بوابة الليل…</p>
    <progress id="loading-progress" aria-label="تقدم التحميل"></progress>
    <p id="loading-notice" hidden></p>
    <button id="loading-retry" type="button" hidden>إعادة المحاولة</button>
    <noscript>يلزم تفعيل JavaScript لتشغيل اللعبة.</noscript>
  </section>
  <script>
    (() => {
      const config = $GODOT_CONFIG;
      const threads = $GODOT_THREADS_ENABLED;
      const canvas = document.getElementById('canvas');
      const loading = document.getElementById('loading');
      const status = document.getElementById('loading-status');
      const progress = document.getElementById('loading-progress');
      const notice = document.getElementById('loading-notice');
      const retry = document.getElementById('loading-retry');
      retry.addEventListener('click', () => window.location.reload());
      let failed = false, ready = false, startedAt = performance.now(), lastProgressAt = startedAt, downloaded = 0;
      const updateNotice = () => {
        if (failed || ready || performance.now() - startedAt < 30000) return;
        notice.hidden = false; retry.hidden = false;
        notice.textContent = performance.now() - lastProgressAt >= 30000 ? 'لم يظهر تقدم جديد. يمكنك الانتظار أو إعادة المحاولة.' : 'ما زالت اللعبة تُحمّل…';
      };
      const fail = (error) => {
        if (failed || ready) return;
        failed = true; clearInterval(watch); console.error('[nobe-loading]', error);
        status.textContent = 'تعذر تشغيل اللعبة. حاول مرة أخرى.'; progress.hidden = true; retry.hidden = false; notice.hidden = true;
      };
      const watch = setInterval(updateNotice, 1000);
      window.addEventListener('error', (event) => fail(event.error || new Error('startup error')));
      window.addEventListener('unhandledrejection', (event) => fail(event.reason || new Error('startup rejected')));
      const onProgress = (current, total) => {
        if (failed || ready) return;
        if (Number.isFinite(current) && current > downloaded) { downloaded = current; lastProgressAt = performance.now(); }
        if (!Number.isFinite(total) || total <= 0) { progress.removeAttribute('value'); status.textContent = 'جارٍ التحميل…'; return; }
        progress.max = total; progress.value = Math.min(current, total);
        status.textContent = current >= total ? 'جارٍ تشغيل اللعبة…' : `${Math.floor(current / total * 100)}%`;
      };
      const start = async () => {
        try {
          const missing = Engine.getMissingFeatures({ threads });
          if (missing.length) throw new Error(`Missing browser features: ${missing.join(', ')}`);
          const engine = new Engine({ ...config, canvas });
          await engine.startGame({ onProgress });
          if (failed) return;
          ready = true; clearInterval(watch); notice.hidden = true; retry.hidden = true;
          requestAnimationFrame(() => requestAnimationFrame(() => { loading.hidden = true; if (config['focusCanvas']) canvas.focus(); }));
        } catch (error) { fail(error); }
      };
      const script = document.createElement('script');
      script.src = '$GODOT_URL';
      script.addEventListener('load', start, { once: true });
      script.addEventListener('error', () => fail(new Error('engine script failed')), { once: true });
      document.head.appendChild(script);
    })();
  </script>
</body>
</html>
